name: gated-release-candidate

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact accepted 40-character source commit
        required: true
        type: string
      release_version:
        description: Exact release tag; PSCAN-06 design permits only v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-v1.0.0
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'ThameeraDananjaya/project-agnostic-secret-scanner' &&
      github.ref == 'refs/tags/v1.0.0' &&
      inputs.release_version == 'v1.0.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PSCAN_SOURCE_REVISION: ${{ inputs.source_revision }}
    steps:
      - name: Validate immutable invocation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PSCAN_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$PSCAN_SOURCE_REVISION"
          test "$GITHUB_REF" = 'refs/tags/v1.0.0'

      - name: Check out exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
          fetch-depth: 1

      - name: Acquire pinned public inputs
        shell: pwsh
        run: ./build/release/acquire.ps1 -CacheDirectory "$env:RUNNER_TEMP/pscan-acquisition" -AllowImagePull

      - name: Build and validate without network
        shell: pwsh
        run: ./build/release/build.ps1 -AcquisitionDirectory "$env:RUNNER_TEMP/pscan-acquisition" -OutputDirectory "$env:RUNNER_TEMP/pscan-release-a"

      - name: Independently rebuild without network
        shell: pwsh
        run: ./build/release/build.ps1 -AcquisitionDirectory "$env:RUNNER_TEMP/pscan-acquisition" -OutputDirectory "$env:RUNNER_TEMP/pscan-release-b"

      - name: Compare every reproduced byte
        shell: bash
        run: |
          set -euo pipefail
          diff -rq "$RUNNER_TEMP/pscan-release-a/dist" "$RUNNER_TEMP/pscan-release-b/dist"

      - name: Transfer exact unsigned candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pscan-v1.0.0-unsigned-candidate
          path: ${{ runner.temp }}/pscan-release-a/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          compression-level: 0

  sign-attest-and-draft:
    needs: build
    if: >-
      vars.PSCAN_RELEASE_GATE == 'PSCAN-07-OWNER-APPROVED' &&
      github.repository == 'ThameeraDananjaya/project-agnostic-secret-scanner' &&
      github.ref == 'refs/tags/v1.0.0' &&
      inputs.release_version == 'v1.0.0'
    environment: release-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
    steps:
      - name: Download exact unsigned candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pscan-v1.0.0-unsigned-candidate
          path: dist

      - name: Acquire and verify pinned Cosign
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/cosign" \
            'https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64'
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/cosign"

      - name: Keyless-sign exact manifest
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cosign" sign-blob --yes \
            --bundle dist/release-manifest.sigstore.json \
            dist/release-manifest.json

      - name: Acquire authenticated Sigstore trusted root
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cosign" trusted-root create \
            --with-default-services \
            --out "$RUNNER_TEMP/sigstore-trusted-root.json"
          sha256sum "$RUNNER_TEMP/sigstore-trusted-root.json"

      - name: Verify exact keyless identity with explicit trusted root
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cosign" verify-blob \
            --bundle dist/release-manifest.sigstore.json \
            --trusted-root "$RUNNER_TEMP/sigstore-trusted-root.json" \
            --certificate-identity 'https://github.com/ThameeraDananjaya/project-agnostic-secret-scanner/.github/workflows/release.yml@refs/tags/v1.0.0' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            dist/release-manifest.json

      - name: Attest platform bundles with the bound SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/project-agnostic-secret-scanner_v1.0.0_linux_amd64.tar.gz
            dist/project-agnostic-secret-scanner_v1.0.0_windows_amd64.zip
          sbom-path: dist/sbom.spdx.json

      - name: Create draft with all assets together
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.0.0 \
            --draft \
            --verify-tag \
            --title 'Project-Agnostic Secret Scanner v1.0.0' \
            --notes-file dist/LIMITATIONS.md \
            dist/*
