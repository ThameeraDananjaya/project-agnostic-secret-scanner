name: native-fixture-diagnostic

on:
  workflow_dispatch:
    inputs:
      diagnostic_revision:
        description: Exact reviewed diagnostic commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-fixture-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: >-
      github.repository == 'ThameeraDananjaya/project-agnostic-secret-scanner' &&
      github.ref == 'refs/heads/main' &&
      github.sha == inputs.diagnostic_revision &&
      github.workflow_sha == inputs.diagnostic_revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.diagnostic_revision }}
          persist-credentials: false
          fetch-depth: 0

      - name: Materialize and verify exact committed fixture sources
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_OPTIONAL_LOCKS=0
          exact="$RUNNER_TEMP/pscan-native-diagnostic"
          mkdir "$exact"
          git -c core.autocrlf=false -c core.eol=lf -c tar.umask=0022 archive "$GITHUB_SHA" build/release | tar -xf - -C "$exact"
          expected=0
          while IFS=$'\t' read -r metadata path; do
            mode="${metadata%% *}"
            remainder="${metadata#* }"
            type="${remainder%% *}"
            object="${remainder##* }"
            test "$type" = blob
            case "$mode" in 100644|100755) ;; *) exit 1 ;; esac
            test "$(git hash-object --no-filters "$exact/$path")" = "$object"
            expected=$((expected + 1))
          done < <(git ls-tree -r "$GITHUB_SHA" -- build/release)
          actual="$(find "$exact/build/release" -type f -printf '%P\n' | wc -l)"
          test "$actual" -eq "$expected"
          echo "PSCAN_EXACT_DIAGNOSTIC_ROOT=$exact" >> "$GITHUB_ENV"

      - name: Validate bounded diagnostic formatter using inert records
        shell: pwsh
        run: '& "$env:PSCAN_EXACT_DIAGNOSTIC_ROOT/build/release/test-native-fixture-diagnostics.ps1"'

      - name: Validate scoped prerequisite using inert providers
        shell: bash
        run: /usr/bin/python3 -I -B "$PSCAN_EXACT_DIAGNOSTIC_ROOT/build/release/test-native-userns-prerequisite.py"

      - name: Install reviewed disposable host prerequisite
        id: prerequisite
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_OPTIONAL_LOCKS=0
          blob="$(git rev-parse "$GITHUB_SHA:build/release/native-userns-prerequisite.py")"
          /usr/bin/sudo --non-interactive /usr/bin/python3 -I -B -c '
          import hashlib, pathlib, re, sys
          path, expected, action = sys.argv[1:]
          if not re.fullmatch(r"[0-9a-f]{40}", expected): raise SystemExit("Invalid source identity")
          with open(path, "rb") as stream: raw = stream.read(65537)
          if len(raw) > 65536: raise SystemExit("Source exceeds bound")
          actual = hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
          if actual != expected: raise SystemExit("Committed source mismatch")
          sys.argv = [path, action]
          exec(compile(raw, path, "exec"), {"__name__": "__main__", "__file__": path, "__source_sha256__": hashlib.sha256(raw).hexdigest()})
          ' "$PSCAN_EXACT_DIAGNOSTIC_ROOT/build/release/native-userns-prerequisite.py" "$blob" install

      - name: Observe fixed native fixture and allowlisted host facts
        shell: pwsh
        run: |
          $startEpoch=[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          & /usr/bin/python3 "$env:PSCAN_EXACT_DIAGNOSTIC_ROOT/build/release/native-host-facts.py" --phase before --since $startEpoch
          if ($LASTEXITCODE -ne 0) { throw 'Before-fixture host facts unavailable' }
          try {
            & "$env:PSCAN_EXACT_DIAGNOSTIC_ROOT/build/release/test-docker-execution.ps1" -InternalMode CleanNative
          } finally {
            & /usr/bin/python3 "$env:PSCAN_EXACT_DIAGNOSTIC_ROOT/build/release/native-host-facts.py" --phase after --since $startEpoch
            if ($LASTEXITCODE -ne 0) { Write-Error 'After-fixture host facts unavailable' }
          }

      - name: Remove only owned prerequisite and verify host preservation
        if: ${{ always() && steps.prerequisite.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_OPTIONAL_LOCKS=0
          blob="$(git rev-parse "$GITHUB_SHA:build/release/native-userns-prerequisite.py")"
          /usr/bin/sudo --non-interactive /usr/bin/python3 -I -B -c '
          import hashlib, pathlib, re, sys
          path, expected, action = sys.argv[1:]
          if not re.fullmatch(r"[0-9a-f]{40}", expected): raise SystemExit("Invalid source identity")
          with open(path, "rb") as stream: raw = stream.read(65537)
          if len(raw) > 65536: raise SystemExit("Source exceeds bound")
          actual = hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
          if actual != expected: raise SystemExit("Committed source mismatch")
          sys.argv = [path, action]
          exec(compile(raw, path, "exec"), {"__name__": "__main__", "__file__": path, "__source_sha256__": hashlib.sha256(raw).hexdigest()})
          ' "$PSCAN_EXACT_DIAGNOSTIC_ROOT/build/release/native-userns-prerequisite.py" "$blob" cleanup
