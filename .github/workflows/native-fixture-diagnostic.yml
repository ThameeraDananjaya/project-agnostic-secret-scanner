name: native-fixture-diagnostic

on:
  workflow_dispatch:
    inputs:
      diagnostic_revision:
        description: Exact reviewed diagnostic commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-fixture-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: >-
      github.repository == 'ThameeraDananjaya/project-agnostic-secret-scanner' &&
      github.ref == 'refs/heads/main' &&
      github.sha == inputs.diagnostic_revision &&
      github.workflow_sha == inputs.diagnostic_revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.diagnostic_revision }}
          persist-credentials: false
          fetch-depth: 0

      - name: Materialize and verify exact committed fixture sources
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_OPTIONAL_LOCKS=0
          exact="$RUNNER_TEMP/pscan-native-diagnostic"
          mkdir "$exact"
          git -c core.autocrlf=false -c core.eol=lf -c tar.umask=0022 archive "$GITHUB_SHA" build/release | tar -xf - -C "$exact"
          expected=0
          while IFS=$'\t' read -r metadata path; do
            mode="${metadata%% *}"
            remainder="${metadata#* }"
            type="${remainder%% *}"
            object="${remainder##* }"
            test "$type" = blob
            case "$mode" in 100644|100755) ;; *) exit 1 ;; esac
            test "$(git hash-object --no-filters "$exact/$path")" = "$object"
            expected=$((expected + 1))
          done < <(git ls-tree -r "$GITHUB_SHA" -- build/release)
          actual="$(find "$exact/build/release" -type f -printf '%P\n' | wc -l)"
          test "$actual" -eq "$expected"
          echo "PSCAN_EXACT_DIAGNOSTIC_ROOT=$exact" >> "$GITHUB_ENV"

      - name: Read named-profile host compatibility without policy or fixture execution
        shell: pwsh
        run: |
          $startEpoch=[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          & /usr/bin/python3 "$env:PSCAN_EXACT_DIAGNOSTIC_ROOT/build/release/native-host-facts.py" --phase before --since $startEpoch
          if ($LASTEXITCODE -ne 0) { throw 'Read-only host compatibility facts unavailable' }
